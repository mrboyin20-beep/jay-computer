
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Result | JAY COMPUTER ACADEMY</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="./dashboard.html"><span class="brand-icon">J</span><span>JAY <b>COMPUTER</b><small>ACADEMY</small></span></a>
    <a class="btn btn-outline" href="./dashboard.html">डैशबोर्ड</a>
  </header>
  <main style="max-width:700px;margin:60px auto;padding:25px">
    <section style="text-align:center;padding:35px;border:1px solid var(--border);border-radius:22px;background:var(--panel)">
      <div style="font-size:45px">🏆</div>
      <h1 style="margin:12px 0">तुम्हारा क्विज रिजल्ट</h1>
      <p id="score" style="font-size:28px;font-weight:800;color:#a8b4ff">रिजल्ट लोड हो रहा है...</p>
      <p id="details" style="color:var(--muted);margin:10px 0 22px"></p>
      <a class="btn btn-primary" href="./quiz.html">दोबारा टेस्ट दें</a>
      <a class="btn btn-outline" href="./dashboard.html">डैशबोर्ड</a>
    </section>
  </main>
  <script type="module">
    import { requireStudent } from "./app.js";
    const session = await requireStudent();

    if (session) {
      const raw = sessionStorage.getItem("jayQuizResult");
      const result = raw ? JSON.parse(raw) : null;
      document.getElementById("score").textContent =
        result ? `${result.score}/${result.total}` : "अभी कोई रिजल्ट नहीं";
      document.getElementById("details").textContent =
        result ? `स्कोर: ${result.percent}%` : "पहले क्विज पूरा करो।";
    }
  </script>
</body>
</html>
