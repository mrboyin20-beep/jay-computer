
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses | JAY COMPUTER ACADEMY</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .page-wrap{max-width:1200px;margin:auto;padding:45px 5%}
    .course-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}
    .course-box{padding:23px;border:1px solid var(--border);border-radius:18px;background:var(--panel)}
    .course-box .number{color:#9daaff;font-size:12px}
    .course-box h2{font-size:17px;margin:12px 0}
    .course-box p{font-size:12px;color:var(--muted);min-height:45px}
    .course-box .btn{margin-top:18px;width:100%}
    @media(max-width:850px){.course-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){.course-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="navbar">
    <a class="brand" href="./dashboard.html"><span class="brand-icon">J</span><span>JAY <b>COMPUTER</b><small>ACADEMY</small></span></a>
    <a class="btn btn-outline" href="./dashboard.html">डैशबोर्ड</a>
  </header>

  <main class="page-wrap">
    <span class="section-kicker">LEARNING LIBRARY</span>
    <h1 style="font-size:clamp(27px,4vw,38px);margin:12px 0">सभी कंप्यूटर कोर्स</h1>
    <p class="muted">अपनी पसंद का कोर्स चुनो और लेसन शुरू करो।</p>
    <section id="courseList" class="course-list"></section>
  </main>

  <script type="module">
    import { requireStudent } from "./app.js";
    import { courses } from "./course-data.js";

    const session = await requireStudent();
    if (session) {
      const list = document.getElementById("courseList");

      courses.forEach((course, index) => {
        const article = document.createElement("article");
        article.className = "course-box";

        const number = document.createElement("span");
        number.className = "number";
        number.textContent = `MODULE ${(index + 1).toString().padStart(2, "0")}`;

        const title = document.createElement("h2");
        title.textContent = course.hindi;

        const desc = document.createElement("p");
        desc.textContent = course.description;

        const meta = document.createElement("p");
        meta.style.marginTop = "12px";
        meta.textContent = `${course.lessons.length} लेसन`;

        const link = document.createElement("a");
        link.className = "btn btn-primary";
        link.href = `./course-details.html?id=${encodeURIComponent(course.id)}`;
        link.textContent = "लेसन देखें →";

        article.append(number, title, desc, meta, link);
        list.append(article);
      });
    }
  </script>
</body>
</html>
